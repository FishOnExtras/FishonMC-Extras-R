name: Nightly Build

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if there are no new commits"
        type: boolean

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  REPOSITORY: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check_commits.outputs.skip }}
      date: ${{ steps.check_commits.outputs.date }}
    steps:
      - id: check_commits
        run: |
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          LAST_NIGHTLY_TAG=$(gh release list -R "$REPOSITORY" --limit 100 --json tagName -q '[.[]|select(.tagName|contains("-nightly-"))][0].tagName//""')
          LAST_RELEASE_NOTES=$([ -z "$LAST_NIGHTLY_TAG" ] || gh release view "$LAST_NIGHTLY_TAG" -R "$REPOSITORY" --json body -q .body)
          SKIP_BUILD=true
          for BRANCH_NAME in 1.21.11 26.1; do
            echo "$LAST_RELEASE_NOTES" | grep -qx "$BRANCH_NAME: $(gh api "repos/$REPOSITORY/commits/$BRANCH_NAME" -q .sha)" || SKIP_BUILD=false
          done
          [ "${{ inputs.force }}" = "true" ] && SKIP_BUILD=false
          echo "skip=$SKIP_BUILD" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {branch: 1.21.11, java: 21}
          - {branch: 26.1, java: 25}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and collect jar
        run: |
          FULL_VERSION=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          FULL_VERSION=${FULL_VERSION%%+*}+${{ matrix.branch }}-nightly-${{ needs.check.outputs.date }}
          bash ./gradlew build -Pmod_version="$FULL_VERSION"
          mkdir out
          cp build/libs/*.jar out/
          echo "${{ matrix.branch }}: $(git rev-parse HEAD)" > out/sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.branch }}
          path: out/
          retention-days: 1

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nightly-*
          path: dist
      - run: |
          BASE_VERSION=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          RELEASE_TAG=${BASE_VERSION%%+*}-nightly-${{ needs.check.outputs.date }}
          gh release create "$RELEASE_TAG" dist/*/*.jar --target "${{ github.sha }}" --title "v$RELEASE_TAG" \
            --notes "Automated nightly builds. May be unstable.

          $(cat dist/*/sha.txt)" --prerelease --latest=false
